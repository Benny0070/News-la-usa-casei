name: Actualizeaza stirile

on:
  schedule:
    # 03:47 UTC = 06:47 ora Romaniei vara (UTC+3) / 05:47 iarna (UTC+2).
    # GitHub mai intarzie de obicei 5-30 min, deci ajunge cam la 6-7:30 dimineata.
    - cron: "47 3 * * *"
  workflow_dispatch: {}  # iti permite sa rulezi manual din tab-ul "Actions"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependinte
        run: pip install -r requirements.txt

      - name: Ruleaza scriptul de stiri
        run: python fetch_news.py

      - name: Salveaza rezultatul in repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json start_date.txt
          git diff --staged --quiet || git commit -m "Actualizare stiri $(date -u +%F)"
          git push
