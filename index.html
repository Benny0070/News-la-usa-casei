<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rezumatul zilei</title>
<style>
  :root{
    --paper:#F2F1EC;
    --ink:#1C1E26;
    --ink-soft:#5B5D67;
    --line:#D8D6CC;
    --flag:#A6362C;
    --flag-soft:#F4E3E0;
    --card:#FBFAF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .masthead{
    position:relative;
    border-bottom:3px double var(--ink);
    padding:22px 18px 14px;
    text-align:center;
    max-width:900px;
    margin:0 auto;
  }
  .day-badge{
    position:absolute;
    top:14px;
    right:16px;
    background:var(--flag);
    color:var(--paper);
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .masthead .date{
    font-size:12px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    text-transform:capitalize;
  }
  .masthead h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:34px;
    margin:6px 0 0;
    letter-spacing:-0.01em;
  }
  .controls{
    max-width:900px;
    margin:18px auto 0;
    padding:0 18px;
  }
  .search-row{display:flex; gap:8px;}
  .search{
    flex:1;
    min-width:0;
    padding:11px 14px;
    font-size:15px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
  }
  .search:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .picker-toggle{
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    padding:0 14px;
    border-radius:6px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .picker{
    display:none;
    margin-top:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
  }
  .picker.open{display:block;}
  .picker-top{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:6px;
  }
  .picker-top .hint{font-size:12px; color:var(--ink-soft); margin-right:auto;}
  .link-btn{
    background:none;
    border:none;
    color:var(--flag);
    font-size:12px;
    cursor:pointer;
    padding:2px 0;
    font-family:inherit;
  }
  .picker-group{margin-top:14px;}
  .picker-group-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:4px;
    margin-bottom:8px;
  }
  .picker-group-head h3{
    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    margin:0;
    margin-right:auto;
  }
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .cat-btn{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:13px;
    padding:6px 11px;
    border-radius:20px;
    cursor:pointer;
    font-family:inherit;
  }
  .cat-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .jump{
    max-width:900px;
    margin:12px auto 0;
    padding:0 18px;
    display:flex;
    gap:14px;
    overflow-x:auto;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
  }
  .jump a{
    font-size:13px;
    color:var(--flag);
    text-decoration:none;
    padding:4px 0;
  }
  .meta-row{
    max-width:900px;
    margin:10px auto 0;
    padding:0 18px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:10px 18px 60px;
  }
  section.category-block{margin-top:28px; scroll-margin-top:12px;}
  section.category-block h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
    border-bottom:1px solid var(--ink);
    padding-bottom:6px;
    margin:0 0 10px;
  }
  .item{
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .item:last-child{border-bottom:none;}
  .item a.headline{
    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    line-height:1.32;
    color:var(--ink);
    text-decoration:none;
    display:block;
  }
  .item a.headline:hover{text-decoration:underline;}
  .item .source-row{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .item .source-row .flag{color:var(--flag); font-weight:600;}
  .rezumat-btn{
    margin-top:8px;
    background:none;
    border:none;
    color:var(--flag);
    font-size:13px;
    padding:0;
    cursor:pointer;
    font-family:inherit;
  }
  .rezumat-text{
    display:none;
    margin-top:8px;
    font-size:14px;
    line-height:1.5;
    background:var(--flag-soft);
    padding:10px 12px;
    border-radius:6px;
  }
  .rezumat-text.open{display:block;}
  .empty, .loading{
    color:var(--ink-soft);
    font-size:14px;
    padding:30px 0;
    text-align:center;
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="day-badge" id="day-badge" style="display:none;"></div>
  <div class="date" id="today"></div>
  <h1>Rezumatul zilei</h1>
</div>

<div class="controls">
  <div class="search-row">
    <input class="search" id="search" type="text" placeholder="Caută în titluri…" />
    <button class="picker-toggle" id="picker-toggle">Categorii</button>
  </div>
  <div class="picker" id="picker">
    <div class="picker-top">
      <span class="hint">Alege ce vrei să vezi. Se ține minte pe acest dispozitiv.</span>
      <button class="link-btn" id="sel-all">Toate</button>
      <button class="link-btn" id="sel-none">Niciuna</button>
      <button class="link-btn" id="sel-default">Implicite</button>
    </div>
    <div id="picker-body"></div>
  </div>
</div>

<div class="jump" id="jump"></div>

<div class="meta-row">
  <span id="updated-at">Se încarcă…</span>
  <span id="count"></span>
</div>

<main id="main">
  <div class="loading">Se încarcă știrile…</div>
</main>

<script>
const DATA_URL = "news.json";
const STORAGE_KEY = "stiri-categorii-active";

let newsData = null;
let activeCategories = [];

document.getElementById("today").textContent = new Date().toLocaleDateString("ro-RO", {
  weekday: "long", day: "numeric", month: "long", year: "numeric"
});

function allKeys(){ return Object.keys(newsData.categories); }
function defaultKeys(){
  return allKeys().filter(k => newsData.categories[k].default);
}

function loadActive(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved)){
      return saved.filter(k => k in newsData.categories);
    }
  }catch(e){}
  return defaultKeys();
}

function saveActive(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(activeCategories)); }catch(e){}
}

function setActive(keys){
  activeCategories = keys;
  saveActive();
  renderPicker();
  renderNews();
}

function toggleKey(key){
  if(activeCategories.includes(key)){
    setActive(activeCategories.filter(k => k !== key));
  } else {
    setActive([...activeCategories, key]);
  }
}

function renderPicker(){
  const body = document.getElementById("picker-body");
  body.innerHTML = "";
  const cats = newsData.categories;
  const groups = newsData.groups || [...new Set(Object.values(cats).map(c => c.group))];

  groups.forEach(g => {
    const keys = allKeys().filter(k => cats[k].group === g);
    if(!keys.length) return;

    const box = document.createElement("div");
    box.className = "picker-group";

    const head = document.createElement("div");
    head.className = "picker-group-head";
    const h3 = document.createElement("h3");
    h3.textContent = g;
    head.appendChild(h3);

    const all = document.createElement("button");
    all.className = "link-btn";
    all.textContent = "toate";
    all.onclick = () => setActive([...new Set([...activeCategories, ...keys])]);
    const none = document.createElement("button");
    none.className = "link-btn";
    none.textContent = "niciuna";
    none.onclick = () => setActive(activeCategories.filter(k => !keys.includes(k)));
    head.appendChild(all);
    head.appendChild(none);
    box.appendChild(head);

    const chips = document.createElement("div");
    chips.className = "chips";
    keys.forEach(k => {
      const b = document.createElement("button");
      b.className = "cat-btn" + (activeCategories.includes(k) ? " active" : "");
      b.textContent = cats[k].label;
      b.onclick = () => toggleKey(k);
      chips.appendChild(b);
    });
    box.appendChild(chips);
    body.appendChild(box);
  });

  document.getElementById("picker-toggle").textContent =
    `Categorii (${activeCategories.length}/${allKeys().length})`;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}

function timeAgo(pubDateStr){
  if(!pubDateStr) return "";
  const then = new Date(pubDateStr);
  if(isNaN(then)) return "";
  const diffMin = Math.max(0, Math.round((Date.now() - then.getTime()) / 60000));
  if(diffMin < 60) return `acum ${diffMin} min`;
  const diffH = Math.round(diffMin / 60);
  if(diffH < 24) return `acum ${diffH} h`;
  return `acum ${Math.round(diffH/24)} zile`;
}

function renderNews(){
  const main = document.getElementById("main");
  const jump = document.getElementById("jump");
  const query = document.getElementById("search").value.trim().toLowerCase();
  main.innerHTML = "";
  jump.innerHTML = "";

  if(activeCategories.length === 0){
    main.innerHTML = `<div class="empty">Nicio categorie aleasă. Apasă „Categorii" și bifează ce te interesează.</div>`;
    document.getElementById("count").textContent = "";
    return;
  }

  let totalShown = 0;

  allKeys().forEach(key => {
    if(!activeCategories.includes(key)) return;
    const cfg = newsData.categories[key];
    const items = (newsData.items[key] || []).filter(it => {
      if(!query) return true;
      return (it.title_ro || "").toLowerCase().includes(query)
          || (it.title || "").toLowerCase().includes(query);
    });
    if(items.length === 0) return;

    totalShown += items.length;

    const a = document.createElement("a");
    a.href = `#sec-${key}`;
    a.textContent = cfg.label;
    jump.appendChild(a);

    const section = document.createElement("section");
    section.className = "category-block";
    section.id = `sec-${key}`;
    const h2 = document.createElement("h2");
    h2.textContent = cfg.label;
    section.appendChild(h2);

    items.forEach((it, idx) => {
      const div = document.createElement("div");
      div.className = "item";
      const rezumatId = `rez-${key}-${idx}`;
      div.innerHTML = `
        <a class="headline" href="${escapeHtml(it.link)}" target="_blank" rel="noopener">${escapeHtml(it.title_ro || it.title)}</a>
        <div class="source-row">
          <span class="flag">${escapeHtml(it.source || "")}</span>
          ${it.published ? " · " + escapeHtml(timeAgo(it.published)) : ""}
        </div>
        ${it.summary_ro ? `
          <button class="rezumat-btn" data-target="${rezumatId}">Rezumat în română ▾</button>
          <div class="rezumat-text" id="${rezumatId}">${escapeHtml(it.summary_ro)}</div>
        ` : ""}
      `;
      section.appendChild(div);
    });

    main.appendChild(section);
  });

  document.querySelectorAll(".rezumat-btn").forEach(btn => {
    btn.onclick = () => document.getElementById(btn.dataset.target).classList.toggle("open");
  });

  if(totalShown === 0){
    main.innerHTML = `<div class="empty">Nicio știre găsită pentru categoriile alese. Încearcă alte categorii sau alt termen de căutare.</div>`;
  }
  document.getElementById("count").textContent = `${totalShown} știri afișate`;
}

fetch(DATA_URL, {cache: "no-store"})
  .then(r => r.json())
  .then(data => {
    newsData = data;
    activeCategories = loadActive();

    document.getElementById("updated-at").textContent =
      "Actualizat: " + new Date(data.generated_at).toLocaleString("ro-RO");

    const day = data.day_number || data.run_number;
    if(day){
      const badge = document.getElementById("day-badge");
      badge.textContent = `Ziua ${day}`;
      badge.style.display = "inline-block";
    }

    renderPicker();
    renderNews();
  })
  .catch(() => {
    document.getElementById("main").innerHTML =
      `<div class="empty">Nu am putut încărca news.json. Rulează manual workflow-ul din tab-ul "Actions".</div>`;
    document.getElementById("updated-at").textContent = "";
  });

document.getElementById("search").addEventListener("input", renderNews);
document.getElementById("picker-toggle").addEventListener("click", () => {
  document.getElementById("picker").classList.toggle("open");
});
document.getElementById("sel-all").onclick = () => setActive(allKeys());
document.getElementById("sel-none").onclick = () => setActive([]);
document.getElementById("sel-default").onclick = () => setActive(defaultKeys());
</script>

</body>
</html>
